
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .edit-container {
            max-width: 650px;
            margin: 60px auto;
        }
    </style>
</head>

<body>

<div class="container edit-container">

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white py-3">
            <h1 class="h4 mb-0">Edit Student</h1>
        </div>

        <div class="card-body p-4">

			
			<form th:action="@{/students/update}" method="post" th:object="${student}">

			    <input type="hidden" th:field="*{id}">

			    <div class="mb-3">
			        <label class="form-label">Student Name</label>
			        <input type="text"
			               th:field="*{name}"
			               class="form-control"
			               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
			               required>

			        <div class="invalid-feedback"
			             th:if="${#fields.hasErrors('name')}"
			             th:errors="*{name}"></div>
			    </div>

			    <div class="mb-3">
			        <label class="form-label">Email Address</label>
			        <input type="email"
			               th:field="*{email}"
			               class="form-control"
			               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
			               required>

			        <div class="invalid-feedback"
			             th:if="${#fields.hasErrors('email')}"
			             th:errors="*{email}"></div>
			    </div>

			    <div class="mb-4">
			        <label class="form-label">Course</label>
			        <input type="text"
			               th:field="*{course}"
			               class="form-control"
			               th:classappend="${#fields.hasErrors('course')} ? 'is-invalid' : ''"
			               required>

			        <div class="invalid-feedback"
			             th:if="${#fields.hasErrors('course')}"
			             th:errors="*{course}"></div>
			    </div>

			    <button type="submit" class="btn btn-primary">
			        Update Student
			    </button>

			    <a th:href="@{/}" class="btn btn-outline-secondary ms-2">
			        Cancel
			    </a>

			</form>


        </div>
    </div>

</div>

</body>
</html>
